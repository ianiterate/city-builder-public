<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>City Builder</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1410; }
      #unity-container { position: fixed; inset: 0; }
      #unity-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #1a1410; outline: none; }
      #unity-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #e8d9b8; font: 16px/1.4 Georgia, "Times New Roman", serif; background: #1a1410; }
      #unity-loading h1 { font-size: 34px; font-weight: normal; letter-spacing: 2px; margin: 0 0 18px; }
      #unity-bar { width: 320px; height: 8px; background: #3a2e22; border: 1px solid #6b5535; border-radius: 4px; overflow: hidden; }
      #unity-bar-fill { width: 0; height: 100%; background: #c9a24d; }
      #unity-warning { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); color: #fff; font: 14px sans-serif; }
      #unity-warning div { margin: 4px 0; padding: 8px 12px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading">
        <h1>City Builder</h1>
        <div id="unity-bar"><div id="unity-bar-fill"></div></div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#unity-warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        banner.appendChild(div);
        if (type == "error") div.style.background = "#8a1f1f";
        else {
          div.style.background = "#6b5535";
          setTimeout(function () { banner.removeChild(div); }, 5000);
        }
      }
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ianiterate",
        productName: "City Builder",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // The canvas fills the window; Unity sizes the render target from its DOM size. Cap the
        // pixel ratio so a retina laptop is not asked to shade four times the pixels.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };
      var script = document.createElement("script");
      script.src = buildUrl + "/Web.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-bar-fill").style.width = 100 * progress + "%";
        }).then(function (unityInstance) {
          document.querySelector("#unity-loading").style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
